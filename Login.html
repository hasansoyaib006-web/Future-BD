
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future BD Login</title>
<style>
*{box-sizing:border-box}
body{
 background:#101010;color:white;
 font-family:Arial;display:flex;
 justify-content:center;align-items:center;
 min-height:100vh;margin:0;padding:20px;
}
.card{
 width:100%;max-width:380px;
 background:#202020;padding:30px;
 border-radius:15px;border:1px solid #b99530;
}
h1{text-align:center;color:#f5c542}
input{
 width:100%;padding:14px;margin:10px 0;
 background:#111;color:white;
 border:1px solid #555;border-radius:8px;
}
button{
 width:100%;padding:14px;
 background:#f5c542;border:0;
 border-radius:8px;font-weight:bold;
}
p{text-align:center;color:#bbb}
a{color:#f5c542}
</style>
</head>
<body>
<div class="card">
<h1>FUTURE BD</h1>
<h2>Login</h2>
<form id="loginForm">
<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>Don't have an account?
<a href="signup.html">Sign Up</a></p>
</div>
<script>
document.getElementById("loginForm")
.addEventListener("submit",function(e){
 e.preventDefault();
 alert("Backend authentication will be connected next.");
});
</script>
</body>
</html>
